name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "brand/**"
      - "docs-site/**"
      - "ops/render-release-notes.sh"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "brand/**"
      - "docs-site/**"
      - "ops/render-release-notes.sh"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm --dir docs-site install --frozen-lockfile

      - name: Build documentation
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: pnpm --dir docs-site run build

      - name: Verify release notes rendering
        run: |
          ./ops/render-release-notes.sh \
            docs-site/src/content/docs/docs/releases/v0.1.0-alpha.2.md \
            | grep -Fx "# Docklane v0.1.0-alpha.2"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
