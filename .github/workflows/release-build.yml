name: Release build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release-build.yml"
      - "cmd/**"
      - "internal/**"
      - "ops/build-release.sh"
      - "ops/bump-aur-docklane-bin.sh"
      - "ops/check-aur-docklane-bin.sh"
      - "ops/check-release-reproducibility.sh"
      - "ops/publish-aur-docklane-bin.sh"
      - "ops/render-release-notes.sh"
      - "ops/prepare-runtime-image-context.sh"
      - "ops/release.Dockerfile"
      - "ops/runtime-image.Dockerfile"
      - "packaging/aur/**"
      - "docs-site/src/content/docs/docs/releases/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in test artifacts
        required: true
        default: v0.0.0-dev
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reproducible Linux artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Install locked web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Select artifact version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="v0.0.0-dev.${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build embedded web UI
        run: pnpm --dir web run build

      - name: Verify committed web assets
        run: git diff --exit-code -- internal/webui/dist

      - name: Prove release reproducibility
        run: ./ops/check-release-reproducibility.sh "${{ steps.version.outputs.version }}"

      - name: Build upload artifacts
        run: ./ops/build-release.sh "${{ steps.version.outputs.version }}" dist

      - name: Verify checksums and package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (
            cd dist
            sha256sum --check checksums.txt
          )
          release_version="${VERSION#v}"
          for architecture in amd64 arm64; do
            archive="dist/docklane_${release_version}_linux_${architecture}.tar.gz"
            tar -tzf "$archive" >"package-${architecture}.txt"
            test "$(wc -l <"package-${architecture}.txt")" -eq 5
            grep -Fx "docklane_${release_version}_linux_${architecture}/" "package-${architecture}.txt"
            grep -Fx "docklane_${release_version}_linux_${architecture}/Dockerfile" "package-${architecture}.txt"
            grep -Fx "docklane_${release_version}_linux_${architecture}/LICENSE" "package-${architecture}.txt"
            grep -Fx "docklane_${release_version}_linux_${architecture}/README.md" "package-${architecture}.txt"
            grep -Fx "docklane_${release_version}_linux_${architecture}/docklane" "package-${architecture}.txt"
          done

      - name: Verify embedded version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_version="${VERSION#v}"
          mkdir version-check
          tar -xzf "dist/docklane_${release_version}_linux_amd64.tar.gz" -C version-check
          test "$(version-check/docklane_${release_version}_linux_amd64/docklane version)" = "docklane ${VERSION}"

      - name: Verify multi-platform runtime-image context
        run: |
          ./ops/prepare-runtime-image-context.sh \
            "${{ steps.version.outputs.version }}" \
            dist \
            runtime-image-check
          test -x runtime-image-check/linux/amd64/docklane
          test -x runtime-image-check/linux/arm64/docklane
          test -f runtime-image-check/Dockerfile

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: docklane-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v6

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: docklane-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$VERSION"
          release_notes="docs-site/src/content/docs/docs/releases/${VERSION}.md"
          rendered_notes="$RUNNER_TEMP/${VERSION}-release-notes.md"
          test -f "$release_notes"
          ./ops/render-release-notes.sh "$release_notes" > "$rendered_notes"
          grep -Fx "# Docklane ${VERSION}" "$rendered_notes"
          gh release create "$VERSION" \
            dist/checksums.txt \
            "dist/docklane_${VERSION#v}_linux_amd64.tar.gz" \
            "dist/docklane_${VERSION#v}_linux_arm64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Docklane ${VERSION}" \
            --notes-file "$rendered_notes"

  publish-container:
    name: Publish multi-platform Docker image
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out image tooling
        uses: actions/checkout@v6

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: docklane-${{ needs.build.outputs.version }}
          path: dist

      - name: Prepare exact release binaries as image context
        run: |
          ./ops/prepare-runtime-image-context.sh \
            "${{ needs.build.outputs.version }}" \
            dist \
            runtime-image

      - name: Select immutable and channel tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "value<<EOF"
            echo "lcaohoanq/docklane:${VERSION}"
            case "$VERSION" in
              *-alpha.*) echo "lcaohoanq/docklane:alpha" ;;
              *-beta.*) echo "lcaohoanq/docklane:beta" ;;
              *-rc.*) echo "lcaohoanq/docklane:rc" ;;
              *) echo "lcaohoanq/docklane:latest" ;;
            esac
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: lcaohoanq
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: runtime-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  publish-aur:
    name: Publish AUR docklane-bin
    if: github.ref_type == 'tag'
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out packaging sources
        uses: actions/checkout@v6

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: docklane-${{ needs.build.outputs.version }}
          path: dist

      - name: Bump docklane-bin packaging metadata
        run: |
          ./ops/bump-aur-docklane-bin.sh \
            "${{ needs.build.outputs.version }}" \
            dist/checksums.txt

      - name: Configure AUR SSH
        id: aur_ssh
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publish"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >"$HOME/.ssh/aur_ed25519"
          if ! grep -q "BEGIN OPENSSH PRIVATE KEY\|BEGIN .* PRIVATE KEY" "$HOME/.ssh/aur_ed25519"; then
            echo "AUR_SSH_PRIVATE_KEY does not look like a private key" >&2
            exit 1
          fi
          chmod 600 "$HOME/.ssh/aur_ed25519"
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >>"$HOME/.ssh/known_hosts"
          {
            echo "Host aur.archlinux.org"
            echo "  User aur"
            echo "  IdentityFile $HOME/.ssh/aur_ed25519"
            echo "  IdentitiesOnly yes"
          } >"$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh -o BatchMode=yes aur@aur.archlinux.org help >/dev/null
          echo "skip=false" >>"$GITHUB_OUTPUT"

      - name: Publish packaging to the AUR
        if: steps.aur_ssh.outputs.skip != 'true'
        env:
          AUR_COMMIT_NAME: lcaohoanq
          AUR_COMMIT_EMAIL: hoangclw@gmail.com
        run: ./ops/publish-aur-docklane-bin.sh packaging/aur/docklane-bin
