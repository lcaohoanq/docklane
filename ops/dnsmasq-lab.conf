# Local wildcard DNS for services published by Traefik.
# systemd-resolved sends only the managed local zones to this listener.
port=53
listen-address=127.0.0.1
bind-interfaces

# Never forward queries back to systemd-resolved. This prevents resolver loops
# for modern HTTPS/SVCB lookups.
no-resolv
local=/lab/
address=/.lab/127.0.0.1
local=/docker.home.arpa/
address=/.docker.home.arpa/127.0.0.1
