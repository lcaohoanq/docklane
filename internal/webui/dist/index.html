    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171212" />
    <link rel="icon" href="/favicon.svg" />
    <title>Docklane</title>
    <script>
      (() => {
        const stored = localStorage.getItem("docklane-theme");
        // `dark` was used before DaisyUI; keep it readable for existing users.
        const theme =
          stored === "light" || stored === "forest"
            ? stored
            : stored === "dark"
              ? "forest"
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "forest"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
