services:
  docklane:
    build:
      context: .
    image: docklane:local
    labels:
      com.docklane.role: controller
    container_name: docklane
    restart: unless-stopped
    command:
      - serve
      - --listen=0.0.0.0:4646
      - --database=/data/docklane.db
      - --base-domain=docker.home.arpa
      - --docker-socket=/var/run/docker.sock
      - --proxy-network=proxy
      - --probe-socket=/run/docklane-probe/probe.sock
      - --traefik-api-url=https://dashboard.lab
      - --traefik-api-address=traefik:443
      - --traefik-api-username=admin
      - --traefik-api-password-file=/run/secrets/traefik-dashboard-password
      - --traefik-api-ca-file=/run/secrets/traefik-local-ca.crt
      - --manage-network-attachments
      - --reconcile-interval=5s
      - --health-history-interval=5m
      - --health-history-limit=288
    ports:
      - "127.0.0.1:4646:4646"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
      - probe-run:/run/docklane-probe
      - ./data/traefik-dashboard-password:/run/secrets/traefik-dashboard-password:ro
      - ${DOCKLANE_TRAEFIK_CA_FILE:-/etc/ca-certificates/trust-source/anchors/traefik-lab-root-ca.crt}:/run/secrets/traefik-local-ca.crt:ro
    networks:
      - control
    depends_on:
      probe:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4646/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  probe:
    image: docklane:local
    labels:
      com.docklane.role: probe
    container_name: docklane-probe
    restart: unless-stopped
    command:
      - probe
      - serve
      - --socket=/run/docklane-probe/probe.sock
    volumes:
      - probe-run:/run/docklane-probe
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/docklane
        - probe
        - check
        - --socket=/run/docklane-probe/probe.sock
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

networks:
  control:
    name: docklane-control
    external: true
  proxy:
    name: proxy
    external: true

volumes:
  probe-run:
    name: docklane-probe-run
